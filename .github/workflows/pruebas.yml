# Tests en cada PR y en main. El despliegue NO va por aquí: el servidor baja main él solo cada 2 minutos
# (deploy/actualizar.sh), así no hace falta guardar claves del servidor en GitHub.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
